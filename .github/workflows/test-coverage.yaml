# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: test-coverage.yaml

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
          ## Put the number in the run summary too, so this job says something
          ## useful whether or not the upload below can run.
          cat(
            sprintf("## Test coverage: %.1f%%\n", covr::percent_coverage(cov)),
            file = Sys.getenv("GITHUB_STEP_SUMMARY"), append = TRUE
          )
        shell: Rscript {0}

      - uses: codecov/codecov-action@v5
        with:
          ## Best effort, deliberately not fatal. This repository has no
          ## CODECOV_TOKEN secret, and Codecov rejects tokenless uploads on a
          ## protected branch ("Token required - not valid tokenless upload"),
          ## which failed this whole job while the coverage measurement itself
          ## had succeeded. The percentage in the step summary above is the
          ## output that matters; the upload and the README badge start
          ## working the moment a CODECOV_TOKEN is added as a repository
          ## secret, at which point set this back to true.
          fail_ci_if_error: false
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
